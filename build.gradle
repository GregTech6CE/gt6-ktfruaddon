plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// The declarations here need the API 0 SDK and the matching mod jar built from the commit pinned in
// libs/gt6ce/build-commit.txt. The 0.8.0 release cannot register them. Neither jar is committed:
// tools/build-gt6ce.ps1 builds both into libs/gt6ce/.
def gtSdk = fileTree(dir: 'libs/gt6ce', include: 'gt6ce-addon-sdk-1.21.1-neoforge-*.jar',
        exclude: ['*-sources.jar', '*-javadoc.jar'])
def gtMod = fileTree(dir: 'libs/gt6ce', include: 'gt6ce-1.21.1-neoforge.jar')

def checkGt6ceJars = tasks.register('checkGt6ceJars') {
    group = 'verification'
    description = 'Stops with build instructions when the GT6CE SDK or runtime jar is missing.'
    def sdk = gtSdk
    def mod = gtMod
    doLast {
        def missing = []
        if (sdk.files.size() != 1) {
            missing << "exactly one libs/gt6ce/gt6ce-addon-sdk-1.21.1-neoforge-*.jar (found ${sdk.files.size()})"
        }
        if (mod.files.isEmpty()) {
            missing << 'libs/gt6ce/gt6ce-1.21.1-neoforge.jar'
        }
        if (!missing.isEmpty()) {
            throw new GradleException("The GT6CE jars are missing: ${missing.join(', ')}.\n" +
                    'Run tools\\build-gt6ce.ps1 to build them from libs/gt6ce/build-commit.txt (see README.md).')
        }
    }
}
tasks.named('compileJava') { dependsOn checkGt6ceJars }
tasks.named('compileTestJava') { dependsOn checkGt6ceJars }

dependencies {
    localRuntime "maven.modrinth:emi:${emi_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"

    // The loader SDK is the only GregTech compile dependency. The full mod jar is the dev runtime.
    // Neither jar is packaged into this one.
    compileOnly gtSdk
    localRuntime gtMod

    // The contract tests run on the plain JVM. The SDK declarations have no Minecraft dependency;
    // the behavior classes do, so the tests share the compile classpath of main.
    testImplementation files(sourceSets.main.compileClasspath)
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
