modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/lombinaxmasson/gt6-ktfruaddon/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/lombinaxmasson/gt6-ktfruaddon"
authors="kuzuanpa, lombinaxmasson"
description='''
Adapts kuzuanpa's kTFRUAddon (https://github.com/kuzuanpa/kTFRUAddon, AGPL-3.0) to GregTech 6 Community Edition on NeoForge 1.21.1, and probes GT6CE's addon API. Recipes, items, materials, structures and machine art come from the upstream mod; the machine behavior is written against GT6CE's addon API and is not a class-for-class port. Work in progress.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="gt6ce"
    type="required"
    versionRange="[0.0.0,0.8)"
    ordering="AFTER"
    side="BOTH"
