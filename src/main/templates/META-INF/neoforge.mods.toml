modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/lombinaxmasson/gt6-ktfruaddon/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/lombinaxmasson/gt6-ktfruaddon"
authors="lombinaxmasson"
description='''
API probe for GT6CE. Single-block recipe machines and fluid fuel generators from the kTFRU surface. Not a class-for-class port of the 1.7.10 addon.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="gt6ce"
    type="required"
    versionRange="[0.8,)"
    ordering="AFTER"
    side="BOTH"
